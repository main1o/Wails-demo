name: Build Official Wails v3 Kitchen Sink APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 修正：补全官方仓库的完整路径
      - name: Clone Wails v3 Official Repo
        run: git clone --depth 1 https://github.com/wailsapp/wails.git wails-src

      # 官方要求 Go 1.25+
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方推荐使用 JDK 21 运行 Gradle
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 新增这一行，放在安装 Wails CLI 之前或之后都可以
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Android SDK Components & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install Wails v3 CLI
        run: |
          cd wails-src/v3/cmd/wails3
          go install
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # 核心修正：显式导出 ANDROID_HOME 与 ANDROID_NDK_HOME
      - name: Wails3 Environment Doctor
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME  # 验证 NDK 目录确实存在
          wails3 doctor

      # 使用官方推荐的 Task 命令打包 fat APK（同时包含 arm64-v8a 和 x86_64）
      - name: Build Kitchen Sink Example APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          cd wails-src/v3/examples/kitchensink
          
          cd frontend
          npm install
          npm run build
          cd ..
          
          wails3 task android:package:fat

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails3-kitchen-sink-apk
          path: wails-src/v3/examples/kitchensink/build/android/outputs/apk/**/*.apk
