name: Build Official Wails v3 Kitchen Sink APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出当前的空仓库
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 【已彻底修复】正确拉取 Wails 官方仓库的 v3 分支源码
      - name: Clone Wails v3 Official Repo
        run: |
          git clone --depth 1 -b v3 https://github.com wails-src

      # 3. 安装 Go 开发环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # 4. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. 配置 Java 21 环境
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 6. 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. 安装匹配的 NDK 核心链
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"

      # 8. 全局编译并安装最新的 Wails v3 CLI 工具
      - name: Install Wails v3 CLI
        run: |
          cd wails-src/v3/cmd/wails3
          go install
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # 9. 自动检测环境是否就绪
      - name: Wails3 Environment Doctor
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          wails3 doctor

      # 10. 进入官方 Kitchen Sink 示例项目目录，编译前端，并打包 APK
      - name: Build Kitchen Sink Example APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd wails-src/v3/examples/kitchensink
          
          # 构建前端依赖
          cd frontend
          npm install
          npm run build
          cd ..
          
          # 执行打包指令
          wails3 build -platform android/arm64

      # 11. 将生成的安装包上传至 GitHub 的 Artifacts 产物中
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails3-kitchen-sink-apk
          path: wails-src/v3/examples/kitchensink/build/android/outputs/apk/**/*.apk
