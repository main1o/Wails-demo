name: Build Official Wails v3 Example APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Wails v3 Official Repo
        run: git clone --depth 1 https://github.com/wailsapp/wails.git wails-src

      # 使用 stable 确保 Go 版本满足 Wails v3 要求
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 安装 Wails 编译所需的 Linux 原生依赖 (GTK4/Webkit)
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Android SDK Components & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install Wails v3 CLI
        run: |
          cd wails-src/v3/cmd/wails3
          go install
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Wails3 Environment Doctor
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME
          wails3 doctor

      # 注意：这里路径已修正为官方示例所在的 mobile 目录
      - name: Build Wails v3 Mobile Example APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          
          cd wails-src/v3/examples/mobile
          
          # 构建前端
          cd frontend
          npm install
          npm run build
          cd ..
          
          # 打包 APK
          wails3 task android:package:fat

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails3-mobile-example-apk
          # 使用通配符抓取 mobile 目录下所有的 apk 文件
          path: wails-src/v3/examples/mobile/build/**/*.apk
