name: Build Official Wails v3 Kitchen Sink APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Wails v3 Official Repo
        run: git clone --depth 1 https://github.com/wailsapp/wails.git wails-src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # 调整为稳定版本
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Install Wails v3 CLI
        run: |
          cd wails-src/v3/cmd/wails3
          go install
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Wails3 Environment Doctor
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264 # 显式指定NDK路径
          wails3 doctor

      - name: Build Kitchen Sink Example APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          cd wails-src/v3/examples/kitchensink
          cd frontend && npm install && npm run build && cd ..
          # 使用官方推荐的 Task 命令进行打包
          wails3 task android:package:fat

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails3-kitchen-sink-apk
          path: wails-src/v3/examples/kitchensink/build/android/outputs/apk/**/*.apk